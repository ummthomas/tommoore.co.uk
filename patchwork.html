        const storeKey = 'unlock:' + location.pathname;
        const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
        const form = document.getElementById('lock-form');
        const input = document.getElementById('lock-password');
        const error = document.getElementById('lock-error');
        const button = form.querySelector('button');

        async function deriveKey(password) {
          const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
          return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(salt), iterations }, base, 256));
        }

        async function open(raw) {
          const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
          const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(iv) }, key, bytes(payload));
          // Remember the key (not the password) for this tab, so moving around the site doesn't ask again
          try { sessionStorage.setItem(storeKey, btoa(String.fromCharCode(...raw))); } catch (e) {}
          // Swapping the page while it is still loading would write the case study in alongside
          // the lock screen instead of replacing it, so wait for the lock screen to finish first
          if (document.readyState !== 'complete') await new Promise((resolve) => window.addEventListener('load', resolve, { once: true }));
          document.open();
          document.write(new TextDecoder().decode(plain));
          document.close();
        }

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          error.hidden = true;
          button.disabled = true;
          button.textContent = 'Unlocking…';
          try {
            await open(await deriveKey(input.value));
          } catch (err) {
            error.hidden = false;
            button.disabled = false;
            button.textContent = 'Unlock';
            input.select();
          }
        });

        try {
          const saved = sessionStorage.getItem(storeKey);
          if (saved) open(bytes(saved)).catch(() => sessionStorage.removeItem(storeKey));
        } catch (e) {}
      })();
