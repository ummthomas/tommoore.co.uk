<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- HTML Meta Tags -->
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}">

    <!-- Facebook Meta Tags -->
    <meta property="og:url" content="{{ og_url }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ title }}">
    <meta property="og:description" content="{{ description }}">
    <meta property="og:image" content="{{ og_image }}">

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta property="twitter:domain" content="tommoore.co.uk">
    <meta property="twitter:url" content="{{ og_url }}">
    <meta name="twitter:title" content="{{ title }}">
    <meta name="twitter:description" content="{{ description }}">
    <meta name="twitter:image" content="{{ og_image }}">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="resources/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    {% if lcp_image %}<link rel="preload" as="image" href="{{ lcp_image }}">{% endif %}
    <script src="resources/js/theme.js"></script>
  </head>

  <body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg">
      <div class="container container-fluid">
        <a class="navbar-brand subhead" href="/">Tom Moore</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link caption-regular{% if active_page == 'work' %} active{% endif %}"{% if active_page == 'work' %} aria-current="page"{% endif %} href="/">Work</a>
            </li>
            <li class="nav-item">
              <a class="nav-link caption-regular{% if active_page == 'about' %} active{% endif %}"{% if active_page == 'about' %} aria-current="page"{% endif %} href="/about">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link caption-regular" target="_blank" href="https://www.linkedin.com/in/tommoore292/">Contact</a>
            </li>
          </ul>
          <button id="theme-toggle" aria-label="Toggle theme"></button>
        </div>
      </div>
    </nav>

    {% block content %}{% endblock %}

    <!-- Footer -->
    <div class="footer">
      <div class="container">
        <div class="footer-content">
          <h4 class="title">Let's connect!</h4>
          <p class="body"><a class="link-large" href="https://www.linkedin.com/in/tommoore292/" target="_blank">Connect on LinkedIn</a> and let's discuss how I can help you.</p>
        </div>
        <p class="caption-regular">Copyright © 2024 Tom Moore</p>
      </div>
    </div>

    {% block scripts %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  </body>

</html>
